name: sign-upload
run-name: "Подпись для человека ${{ inputs.req }} → ${{ inputs.cert }}"
on:
  workflow_dispatch:
    inputs:
      req:   { description: "id задачи", required: true }
      parts: { description: "кусков", required: true }
      cert:  { description: "id сертификата", required: true }
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Собрать zsign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ pkg-config libssl-dev libminizip-dev zlib1g-dev >/dev/null
          git clone -q --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          make -s -C /tmp/zsign/build/linux -j4
          sudo cp /tmp/zsign/bin/zsign /usr/local/bin/zsign
      - name: Подписать
        env:
          REQ: ${{ inputs.req }}
          PARTS: ${{ inputs.parts }}
          CERT: ${{ inputs.cert }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          CALLBACK_KEY: ${{ secrets.CALLBACK_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 tools/ci_upload.py sign
