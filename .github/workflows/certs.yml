name: certs
run-name: "Проверка сертификатов"
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Проверить отзыв (OCSP Apple)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci.py certs
